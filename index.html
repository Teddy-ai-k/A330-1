<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta A330 Interactive 3D Flight View</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b1528;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.75);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 320px;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.02em;
            color: #f8fafc;
        }
        .sub {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .instructions {
            font-size: 0.75rem;
            color: #cbd5e1;
            line-height: 1.4;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }
        .controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.75);
            padding: 12px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: background 0.2s;
            pointer-events: auto;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
    <!-- Include Three.js and OrbitControls via unpkg CDN -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="ui-overlay">
        <h1>Delta Air Lines A330</h1>
        <div class="sub">3D Interactive Flight Inspector</div>
        <div class="instructions">
            • <b>Drag cursor:</b> Rotate camera angle<br>
            • <b>Scroll Wheel:</b> Zoom in / out<br>
            • <b>Right-click + Drag:</b> Pan scene viewport
        </div>
    </div>

    <div class="controls-panel">
        <button id="toggle-rot">Pause Auto-Rotation</button>
        <button id="reset-cam">Reset View</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- Setup Scene, Camera, and Renderer ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Add sky gradient background color
        scene.background = new THREE.Color(0x38bdf8);
        scene.fog = new THREE.FogExp2(0x38bdf8, 0.005);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 12, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Add standard OrbitControls for cursor manipulation
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 100;
        controls.minDistance = 10;

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        sunLight.position.set(40, 60, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const bellyLight = new THREE.DirectionalLight(0x0c4a6e, 0.4); // Subtle blue sky bounce illumination from underneath
        bellyLight.position.set(0, -50, 0);
        scene.add(bellyLight);

        // --- Material Definitions ---
        const liveryWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 });
        const deltaNavy = new THREE.MeshStandardMaterial({ color: 0x002244, roughness: 0.3 });
        const deltaRed = new THREE.MeshStandardMaterial({ color: 0xe31b23, roughness: 0.4 });
        const engineMetal = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.6, roughness: 0.2 });
        const windshieldMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });

        // --- Group Container for Airplane ---
        const aircraftGroup = new THREE.Group();
        scene.add(aircraftGroup);

        // --- Procedural Aircraft Mesh Generation ---
        // 1. Fuselage
        const fuselageGeo = new THREE.CylinderGeometry(1.6, 1.6, 22, 32);
        fuselageGeo.rotateX(Math.PI / 2); // Align parallel to flight stream axis Z
        const fuselage = new THREE.Mesh(fuselageGeo, liveryWhite);
        aircraftGroup.add(fuselage);

        // Nose Cone
        const noseGeo = new THREE.SphereGeometry(1.6, 32, 16);
        noseGeo.scale(1, 0.9, 1.4); // Taper forwards
        const nose = new THREE.Mesh(noseGeo, liveryWhite);
        nose.position.set(0, 0, 11);
        aircraftGroup.add(nose);

        // Windshield cockpit wrap
        const windshieldGeo = new THREE.BoxGeometry(1.4, 0.5, 0.8);
        const windshield = new THREE.Mesh(windshieldGeo, windshieldMat);
        windshield.position.set(0, 0.7, 11.2);
        windshield.rotation.x = -0.3;
        aircraftGroup.add(windshield);

        // Tail Cone Taper
        const tailConeGeo = new THREE.ConeGeometry(1.6, 6, 32);
        tailConeGeo.rotateX(-Math.PI / 2);
        const tailCone = new THREE.Mesh(tailConeGeo, deltaNavy); // Delta dark navy underbelly/rear scheme starts
        tailCone.position.set(0, 0.2, -14);
        tailCone.scale.set(1, 0.7, 1);
        aircraftGroup.add(tailCone);

        // 2. Wings (A330 swept back layout style)
        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 0);
        wingShape.lineTo(16, -6);
        wingShape.lineTo(15.5, -7.5);
        wingShape.lineTo(0, -3);
        wingShape.lineTo(0, 0);

        const wingExtrudeSettings = { depth: 0.15, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
        const wingGeo = new THREE.ExtrudeGeometry(wingShape, wingExtrudeSettings);
        wingGeo.rotateX(Math.PI / 2);

        // Left Wing
        const leftWing = new THREE.Mesh(wingGeo, liveryWhite);
        leftWing.position.set(0.8, -0.3, 2);
        leftWing.rotation.z = 0.08; // Dihedral angle up sweep
        aircraftGroup.add(leftWing);

        // Right Wing (Mirrored)
        const rightWing = leftWing.clone();
        rightWing.scale.x = -1;
        rightWing.position.x = -0.8;
        aircraftGroup.add(rightWing);

        // Winglets
        const wingletGeo = new THREE.ConeGeometry(0.3, 1.5, 4);
        wingletGeo.rotateX(Math.PI / 4);
        
        const leftWinglet = new THREE.Mesh(wingletGeo, deltaRed);
        leftWinglet.position.set(15.8, 1.2, -4.5);
        aircraftGroup.add(leftWinglet);

        const rightWinglet = leftWinglet.clone();
        rightWinglet.position.x = -15.8;
        rightWinglet.rotation.y = Math.PI;
        aircraftGroup.add(rightWinglet);

        // 3. Horizontal Tail Stabilizers
        const tailPlaneShape = new THREE.Shape();
        tailPlaneShape.moveTo(0, 0);
        tailPlaneShape.lineTo(5, -2.5);
        tailPlaneShape.lineTo(4.8, -3.2);
        tailPlaneShape.lineTo(0, -1.2);
        
        const tailPlaneGeo = new THREE.ExtrudeGeometry(tailPlaneShape, wingExtrudeSettings);
        tailPlaneGeo.rotateX(Math.PI / 2);

        const leftTailPlane = new THREE.Mesh(tailPlaneGeo, liveryWhite);
        leftTailPlane.position.set(0.5, 0.4, -13);
        leftTailPlane.rotation.z = 0.1;
        aircraftGroup.add(leftTailPlane);

        const rightTailPlane = leftTailPlane.clone();
        rightTailPlane.scale.x = -1;
        rightTailPlane.position.x = -0.5;
        aircraftGroup.add(rightTailPlane);

        // 4. Vertical Stabilizer (Tail Fin)
        const finShape = new THREE.Shape();
        finShape.moveTo(0, 0);
        finShape.lineTo(0, 5.5);
        finShape.lineTo(-1.8, 5.2);
        finShape.lineTo(-3.5, 0);

        const finExtrudeSettings = { depth: 0.2, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 };
        const finGeo = new THREE.ExtrudeGeometry(finShape, finExtrudeSettings);
        
        const verticalFin = new THREE.Mesh(finGeo, deltaNavy);
        verticalFin.position.set(0, 1.4, -13);
        aircraftGroup.add(verticalFin);

        // Red Widget decal accent on the tail fin
        const widgetGeo = new THREE.ConeGeometry(0.7, 1.8, 3);
        widgetGeo.rotateZ(Math.PI / 6);
        const widgetDecalLeft = new THREE.Mesh(widgetGeo, deltaRed);
        widgetDecalLeft.position.set(0.12, 4, -14.2);
        widgetDecalLeft.scale.set(0.1, 1, 1);
        aircraftGroup.add(widgetDecalLeft);

        const widgetDecalRight = widgetDecalLeft.clone();
        widgetDecalRight.position.x = -0.12;
        aircraftGroup.add(widgetDecalRight);

        // 5. Twin Turbofan Engines
        const engineGeo = new THREE.CylinderGeometry(0.9, 0.7, 3.2, 24);
        engineGeo.rotateX(Math.PI / 2);
        
        const leftEngine = new THREE.Mesh(engineGeo, liveryWhite);
        leftEngine.position.set(5.5, -1.2, 1);
        aircraftGroup.add(leftEngine);

        const engineCoreGeo = new THREE.CylinderGeometry(0.75, 0.75, 0.4, 24);
        engineCoreGeo.rotateX(Math.PI / 2);
        const leftEngineCore = new THREE.Mesh(engineCoreGeo, engineMetal);
        leftEngineCore.position.set(5.5, -1.2, 2.5);
        aircraftGroup.add(leftEngineCore);

        const rightEngine = leftEngine.clone();
        rightEngine.position.x = -5.5;
        aircraftGroup.add(rightEngine);

        const rightEngineCore = leftEngineCore.clone();
        rightEngineCore.position.x = -5.5;
        aircraftGroup.add(rightEngineCore);


        // --- Environmental Flying Clouds ---
        const cloudGroup = new THREE.Group();
        scene.add(cloudGroup);

        const cloudGeo = new THREE.DodecahedronGeometry(2.5, 1);
        const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });

        for (let i = 0; i < 25; i++) {
            const instanceGroup = new THREE.Group();
            const numBlobs = 3 + Math.floor(Math.random() * 4);
            
            for(let j=0; j<numBlobs; j++) {
                const blob = new THREE.Mesh(cloudGeo, cloudMat);
                blob.position.set(j * 1.8, Math.sin(j) * 0.5, Math.cos(j) * 0.5);
                const s = 0.8 + Math.random() * 1.2;
                blob.scale.set(s,s,s);
                instanceGroup.add(blob);
            }

            instanceGroup.position.set(
                (Math.random() - 0.5) * 160,
                -8 - Math.random() * 12,
                (Math.random() - 0.5) * 160
            );
            cloudGroup.add(instanceGroup);
        }

        // --- Interaction Controls ---
        let autoRotateActive = true;

        document.getElementById('toggle-rot').addEventListener('click', (e) => {
            autoRotateActive = !autoRotateActive;
            e.target.textContent = autoRotateActive ? "Pause Auto-Rotation" : "Resume Auto-Rotation";
        });

        document.getElementById('reset-cam').addEventListener('click', () => {
            camera.position.set(25, 12, 35);
            controls.target.set(0, 0, 0);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Move clouds backward to simulate forward flight speed
            cloudGroup.children.forEach(cloud => {
                cloud.position.z += 25 * delta;
                if (cloud.position.z > 80) {
                    cloud.position.z = -80;
                    cloud.position.x = (Math.random() - 0.5) * 160;
                }
            });

            // Flotation/turbulent engine emulation
            aircraftGroup.position.y = Math.sin(time * 1.5) * 0.25;
            aircraftGroup.rotation.z = Math.sin(time * 0.8) * 0.02;

            if (autoRotateActive) {
                aircraftGroup.rotation.y += 0.15 * delta;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
